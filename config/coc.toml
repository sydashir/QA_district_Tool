# Connections (COC) — base URL cross-checked against the live NAP sheet (matches CLAUDE.md §6).
# Sitemap: Rank Math default /sitemap_index.xml — CONFIRM via the access probe before a full crawl.
brand = "COC"
name = "Connections"
base_url = "https://connectionsoc.com"
sitemap_url = "https://connectionsoc.com/sitemap_index.xml"
canonical_phones = ["844-759-0999"]  # national only; per-location + retired come from the NAP canon (canon_for)

[crawl]
max_concurrency = 5
delay_seconds = 0.25
timeout_seconds = 20.0
max_retries = 3  # bumped: sitemap child fetches must survive throttle so the read is complete
exclude = ["/wp-admin", "?"]

[wp_rest]
enabled = true
base_url = "https://connectionsoc.com"
post_types = ["pages", "posts"]
username_env = "COC_WP_USER"
password_env = "COC_WP_PASS"
