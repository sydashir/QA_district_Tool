# The District Recovery Community (TDRC) — base URL cross-checked against the live NAP sheet (matches CLAUDE.md §6).
# Sitemap: Rank Math default /sitemap_index.xml — CONFIRM via the access probe before a full crawl.
brand = "TDRC"
name = "The District Recovery Community"
base_url = "https://thedistrictrecoverycommunity.com"
sitemap_url = "https://thedistrictrecoverycommunity.com/sitemap_index.xml"
canonical_phones = ["888-871-2088"]  # national only; per-location + retired come from the NAP canon (canon_for)

[crawl]
max_concurrency = 5
delay_seconds = 0.25
timeout_seconds = 20.0
max_retries = 1
exclude = ["/wp-admin", "?"]

[wp_rest]
enabled = true
base_url = "https://thedistrictrecoverycommunity.com"
post_types = ["pages", "posts"]
username_env = "TDRC_WP_USER"
password_env = "TDRC_WP_PASS"
