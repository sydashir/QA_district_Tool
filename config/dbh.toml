# District Behavioral Health (DBH) — parent brand. URL confirmed by Syed 2026-07-20
# (was absent from the NAP sheet; the sheet has the phone only). Sitemap: Rank Math
# default /sitemap_index.xml — CONFIRM via the access probe before a full crawl.
brand = "DBH"
name = "District Behavioral Health"
base_url = "https://districtbehavioralhealth.com"
sitemap_url = "https://districtbehavioralhealth.com/sitemap_index.xml"  # 404s since the replatform
# DBH was rebuilt as headless WordPress behind Next.js on 2026-08-08 (X-Powered-By: Next.js,
# x-nextjs-prerender: 1). Sitemap, robots.txt and WP-REST ALL return 404 — the site has no index to
# read — so enumeration falls back to this static page list. LIMITATION: a static list cannot
# discover pages added after it was written. Regenerate from a fresh crawl or from the CMS whenever
# DBH publishes new pages, or they will never be audited.
urls_file = "config/urls/dbh.txt"
canonical_phones = ["888-707-6073"]  # national only; NAP canon (canon_for) carries the full set

[crawl]
max_concurrency = 5
delay_seconds = 0.25
timeout_seconds = 20.0
max_retries = 3  # bumped: sitemap child fetches must survive throttle so the read is complete
exclude = ["/wp-admin", "?"]

[wp_rest]
enabled = true
base_url = "https://districtbehavioralhealth.com"
post_types = ["pages", "posts"]
username_env = "DBH_WP_USER"
password_env = "DBH_WP_PASS"
