# Alliance Recovery (AR) — base URL cross-checked against the live NAP sheet (matches CLAUDE.md §6).
# Sitemap: Rank Math default /sitemap_index.xml — CONFIRM via the access probe before a full crawl.
brand = "AR"
name = "Alliance Recovery"
base_url = "https://alliancerecovery.com"
sitemap_url = "https://alliancerecovery.com/sitemap_index.xml"
canonical_phones = ["844-287-8506"]  # national only; per-location + retired come from the NAP canon (canon_for)

[crawl]
max_concurrency = 5
delay_seconds = 0.25
timeout_seconds = 20.0
max_retries = 3  # sitemap children must survive throttle so the read is never silently partial
# /city-data/ = ~10,740 URLs that all serve ONE byte-identical page (verified: 10 spread samples ->
# 1 content hash, 84% carry a -N dup slug, generic non-localized H1). They are a duplicate-doorway
# SEO liability reported once in reports/ar/DOORWAY_FINDING.md — auditing 10,740 copies of one page
# would bury AR's ~500 real pages in noise and waste the link-probe budget. Excluded from the crawl
# BY DESIGN, not by accident; the doorway finding stands on its own.
exclude = ["/wp-admin", "?", "/city-data/"]

[wp_rest]
enabled = true
base_url = "https://alliancerecovery.com"
post_types = ["pages", "posts"]
username_env = "AR_WP_USER"
password_env = "AR_WP_PASS"
