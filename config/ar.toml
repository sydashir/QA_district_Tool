# Alliance Recovery (AR) — base URL cross-checked against the live NAP sheet (matches CLAUDE.md §6).
# Sitemap: Rank Math default /sitemap_index.xml — CONFIRM via the access probe before a full crawl.
brand = "AR"
name = "Alliance Recovery"
base_url = "https://alliancerecovery.com"
sitemap_url = "https://alliancerecovery.com/sitemap_index.xml"
canonical_phones = ["844-287-8506"]  # national only; per-location + retired come from the NAP canon (canon_for)

[crawl]
max_concurrency = 5
delay_seconds = 0.25
timeout_seconds = 20.0
max_retries = 1
exclude = ["/wp-admin", "?"]

[wp_rest]
enabled = true
base_url = "https://alliancerecovery.com"
post_types = ["pages", "posts"]
username_env = "AR_WP_USER"
password_env = "AR_WP_PASS"
