      - heading "Gratitude Lodge Admissions" [level=2] [ref=f12e678]
      - paragraph [ref=f12e681]: "Starting your journey toward recovery at Gratitude Lodge is simple, fast, and fully supported. We offer same-day and next-day admissions, because when you’re ready to get help, there shouldn’t be any delays. Walk-ins are also welcome—we’re here when you’re ready to take that first step. From the moment you reach out, our compassionate admissions team will guide you through every part of the process, from insurance verification to creating a personalized treatment plan tailored to your needs. Our goal is to make the process stress-free, so you can focus on what matters most: your healing and recovery."
      - link "Contact Us" [ref=f12e685] [cursor=pointer]:
        - /url: /contact-us/
