# Alembic config for the product layer's Postgres schema (server/models.py).
#
# The connection URL is deliberately NOT set here. `migrations/env.py` reads it from the
# DATABASE_URL environment variable and falls back to `server.db.DATABASE_URL`, so there is
# exactly ONE definition of "where the database is" for the API, the worker and migrations.
# A url in this file would be a second one, and the two would drift.

[alembic]
script_location = migrations

# Run from the repo root so `import server.models` resolves in env.py.
prepend_sys_path = .

# Timestamped filenames keep `versions/` readable in date order at a glance.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Revision timestamps in UTC — this tool is operated across timezones.
timezone = UTC

sqlalchemy.url =


[post_write_hooks]
# none — the repo has no autoformatter wired up


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
