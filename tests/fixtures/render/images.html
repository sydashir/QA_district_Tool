<!doctype html><html><head><meta charset="utf-8"><title>images fixture</title></head><body>
  <!-- loads fine: a 1x1 gif inline -->
  <img id="ok" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" width="40" height="40" alt="fine">
  <!-- BROKEN: file does not exist, and it occupies space -->
  <img id="broken" src="./does-not-exist.png" width="120" height="80" alt="missing hero">
  <!-- hidden: nobody sees it, must NOT be reported -->
  <img id="hidden" src="./also-missing.png" style="display:none" alt="hidden">
  <!-- zero-box spacer: must NOT be reported -->
  <img id="spacer" src="./spacer-missing.png" width="0" height="0" alt="">
  <!-- no src at all: the HTML layer owns this, must NOT be reported here -->
  <img id="nosrc" alt="no source">
  <!-- lazy, far below the fold: must NOT be reported once we scroll -->
  <div style="height:3000px"></div>
  <img id="lazy" loading="lazy" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" width="40" height="40" alt="lazy but fine">
</body></html>
